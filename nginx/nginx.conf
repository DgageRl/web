events {}

http {
    # Этот файл CI будет перезаписывать: server site_blue:80; или server site_green:80;
    include /etc/nginx/upstream.conf;

    server {
        listen 80;

        location / {
            proxy_pass http://site_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
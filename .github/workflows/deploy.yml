name: Blue-Green Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Оставляем кнопку для ручного запуска, но выбор окружения не нужен

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Artifact
        shell: pwsh
        run: |
          # Создаем папку для сборки, если нет
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          
          # Копируем исходники сайта
          Copy-Item -Path "src\*" -Destination ".build\" -Recurse -Force
          
          # Подставляем переменные в HTML (Версия, Время)
          $htmlPath = ".build\index.html"
          if (Test-Path $htmlPath) {
              $content = Get-Content $htmlPath -Raw
              $content = $content -replace '__VERSION__', "${env:GITHUB_RUN_NUMBER}"
              $content = $content -replace '__BUILD_TIME__', (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss") + " UTC"
              Set-Content -Path $htmlPath -Value $content
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: .build/

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: .build/

      - name: Determine Target Environment & Deploy
        shell: pwsh
        run: |
          # 1. Читаем текущий активный контейнер из конфига Nginx
          $nginxConfPath = ".\nginx\upstream.conf"
          $confContent = Get-Content $nginxConfPath -Raw
          
          if ($confContent -match "site_blue") {
              $activeEnv = "blue"
              $targetEnv = "green"
          } else {
              $activeEnv = "green"
              $targetEnv = "blue"
          }
          
          Write-Host "Active environment: $activeEnv"
          Write-Host "Deploying to target environment: $targetEnv"

          # 2. Копируем файлы сборки в папку целевого Docker-контекста
          # В вашем docker-compose.yml контекст для сборки - это корень проекта, 
          # а Dockerfile копирует из ./src. Следовательно, нужно обновить ./src
          Remove-Item -Path "src\*" -Recurse -Force
          Copy-Item -Path ".build\*" -Destination "src\" -Recurse -Force

          # 3. Пересобираем и перезапускаем ТОЛЬКО целевой контейнер
          # Важно: используем --no-deps, чтобы не трогать nginx и активный контейнер
          Write-Host "Building and starting site_$targetEnv..."
          docker compose up -d --build --no-deps "site_$targetEnv"

      - name: Verify Target Environment
        shell: pwsh
        run: |
          # Определяем target по аналогии с предыдущим шагом (или можно передать через output)
          # Для простоты повторим логику чтения конфига
          $confContent = Get-Content ".\nginx\upstream.conf" -Raw
          if ($confContent -match "site_blue") { $targetEnv = "green" } else { $targetEnv = "blue" }

          Write-Host "Verifying site_$targetEnv..."
          
          # Проверяем, что контейнер запущен и внутри есть наш файл
          $containerName = "site_$targetEnv"
          $result = docker exec $containerName cat /usr/share/nginx/html/index.html
          
          if ($result -match "${env:GITHUB_RUN_NUMBER}") {
              Write-Host "Verification passed: Version ${env:GITHUB_RUN_NUMBER} found."
          } else {
              Write-Error "Verification failed: Version mismatch."
              exit 1
          }

  switch:
    needs: deploy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Switch Traffic
        shell: pwsh
        run: |
          # 1. Определяем целевое окружение
          $confContent = Get-Content ".\nginx\upstream.conf" -Raw
          if ($confContent -match "site_blue") { $targetEnv = "green" } else { $targetEnv = "blue" }
          
          Write-Host "Switching traffic to site_$targetEnv..."

          # 2. Обновляем upstream.conf
          "upstream site_pool { server site_${targetEnv}:80; }" | Set-Content -Path ".\nginx\upstream.conf"

          # 3. Копируем обновленный конфиг в контейнер nginx и перезагружаем
          # Предполагаем, что имя контейнера nginx - nginx_proxy (как в вашем compose)
          docker cp .\nginx\upstream.conf nginx_proxy:/etc/nginx/upstream.conf
          
          # Проверка синтаксиса и graceful reload
          docker exec nginx_proxy nginx -t
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Nginx config test failed"
              exit 1
          }
          
          docker exec nginx_proxy nginx -s reload
          Write-Host "Traffic successfully switched to $targetEnv."
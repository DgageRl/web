services:
  site_blue:
    build:
      context: ./site
      args:
        - BUILD_ENV=blue
    image: my-site:blue
    container_name: site_blue
    restart: unless-stopped

  site_green:
    build:
      context: ./site
    image: my-site:green
    container_name: site_green
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/upstream.conf:ro
    depends_on:
      - site_blue
      - site_green
    restart: unless-stopped